services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: ${BACKEND_IMAGE:-juneyou/innocenz-backend:latest}
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-7777}:7777'

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Must match apps/web/Dockerfile ARG names (Vite, not NEXT_PUBLIC_*).
        VITE_API_URL: ${VITE_API_URL:-https://api.innocenz.duckdns.org/api}
        VITE_GRAPHQL_ENDPOINT: ${VITE_GRAPHQL_ENDPOINT:-}
        VITE_R2_PUBLIC_URL: ${VITE_R2_PUBLIC_URL:-}
        VITE_OUTLET_ROLE_ID: ${VITE_OUTLET_ROLE_ID:-}
        VITE_AGENCY_ROLE_ID: ${VITE_AGENCY_ROLE_ID:-}
    image: ${FRONTEND_IMAGE:-juneyou/innocenz-frontend:latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - backend
