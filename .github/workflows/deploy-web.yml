name: Deploy web

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f apps/web/Dockerfile -t innocenz-web:${{ github.sha }} .

      - name: Save image to a tarball
        run: docker save innocenz-web:${{ github.sha }} | gzip > innocenz-web.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          source: 'innocenz-web.tar.gz'
          target: ${{ vars.DEPLOY_REMOTE_DIR || '~/innocenz-web' }}

      - name: Load image and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_REMOTE_DIR || '~/innocenz-web' }}
            gunzip -f innocenz-web.tar.gz
            docker load -i innocenz-web.tar
            docker stop innocenz-web || true
            docker rm innocenz-web || true
            docker run -d \
              --name innocenz-web \
              -p ${{ vars.DEPLOY_HOST_PORT || 3000 }}:3000 \
              --restart unless-stopped \
              innocenz-web:${{ github.sha }}
            docker image prune -f
            rm -f innocenz-web.tar
