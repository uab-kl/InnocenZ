name: Deploy Staging

on:
  # Manual run from Actions → Deploy Staging → "Run workflow"
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'staging-*'
      - 'beta-*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: juneyou

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "frontend_tags=${DOCKERHUB_NAMESPACE}/innocenz-frontend:staging-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-frontend:staging" >> "$GITHUB_OUTPUT"
          echo "backend_tags=${DOCKERHUB_NAMESPACE}/innocenz-backend:staging-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-backend:staging" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_STAGING }}
            VITE_GRAPHQL_ENDPOINT=${{ secrets.VITE_GRAPHQL_ENDPOINT_STAGING }}
            VITE_OUTLET_ROLE_ID=${{ secrets.VITE_OUTLET_ROLE_ID_STAGING }}
            VITE_AGENCY_ROLE_ID=${{ secrets.VITE_AGENCY_ROLE_ID_STAGING }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
