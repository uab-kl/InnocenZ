# Installed by UAB Support Desk (Settings -> AI Model).
# Triggered directly by the "Fix with AI" button on a ticket (workflow
# dispatch — no GitHub issue involved), or by commenting @claude on an
# issue/PR manually.
name: Claude Code
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Claude (sent by UAB Support Desk)"
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.task || '' }}
          # Automation mode denies write tools by default — grant what a fix
          # needs: explore, edit, git branch/commit/push, and gh pr create.
          claude_args: '--allowedTools "Read,Grep,Glob,LS,Write,Edit,MultiEdit,Bash(git:*),Bash(gh pr:*),Bash(ls:*),Bash(cat:*),Bash(node:*),Bash(npm:*),Bash(pnpm:*)"'
      # Claude's final words otherwise vanish into a temp file — surface them
      # on the run's Summary page so "no PR" always comes with an explanation.
      - name: Publish Claude's report to the run summary
        if: always()
        run: |
          FILE="${{ runner.temp }}/claude-execution-output.json"
          {
            echo "## Claude's report"
            echo ""
            if [ -f "$FILE" ]; then
              jq -r '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text] | join("\n\n---\n\n")' "$FILE" 2>/dev/null || echo "(could not parse Claude output)"
            else
              echo "(no output file found)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
