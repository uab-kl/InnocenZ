name: Deploy

# Builds + pushes Docker images to Docker Hub, then SSHes to the VPS and rolls
# them out by running tools/deploy/deploy.sh there — the same script a
# `pnpm deploy:<env>` from a PC runs. Deploying from GitHub alone is enough to
# put the new build online; no local Docker build or push is needed.
#
# The server is provisioned ONCE from a PC (`pnpm deploy:staging`), which is what
# creates ~/innocenz-<env>/ with its Caddyfile + .env.backend. Those two stay
# server-managed and never travel through CI: .env.backend holds the DB/R2
# secrets, and Caddyfile encodes that server's own domain.
#
# Triggers:
#   - Manual: Actions → Deploy → Run workflow → pick environment
#   - Tags:   staging-* / beta-* → staging
#             v*                 → production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (image tag + VITE_* secrets)
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      deploy:
        description: Roll out to the server after building
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
      - 'staging-*'
      - 'beta-*'

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: juneyou
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      frontend_tags: ${{ steps.meta.outputs.frontend_tags }}
      backend_tags: ${{ steps.meta.outputs.backend_tags }}
      env_upper: ${{ steps.meta.outputs.env_upper }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine environment + image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # Manual run wins; otherwise infer from tag.
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "${ENV}" ]; then
            REF="${GITHUB_REF_NAME}"
            case "${REF}" in
              v*) ENV=production ;;
              staging-*|beta-*) ENV=staging ;;
              *)
                echo "Cannot infer environment from ref: ${REF}"
                exit 1
                ;;
            esac
          fi

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "env_upper=$(echo "${ENV}" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${DOCKERHUB_NAMESPACE}/innocenz-frontend:${ENV}-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-frontend:${ENV}" >> "$GITHUB_OUTPUT"
          echo "backend_tags=${DOCKERHUB_NAMESPACE}/innocenz-backend:${ENV}-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-backend:${ENV}" >> "$GITHUB_OUTPUT"
          echo "Building for environment=${ENV}"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve VITE_* for environment
        id: vite
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ needs.prepare.outputs.environment }}"
          if [ "${ENV}" = "production" ]; then
            echo "api_url=${{ secrets.VITE_API_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "graphql=${{ secrets.VITE_GRAPHQL_ENDPOINT_PROD }}" >> "$GITHUB_OUTPUT"
            echo "r2=${{ secrets.VITE_R2_PUBLIC_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "outlet_role=${{ secrets.VITE_OUTLET_ROLE_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "agency_role=${{ secrets.VITE_AGENCY_ROLE_ID_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ secrets.VITE_API_URL_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "graphql=${{ secrets.VITE_GRAPHQL_ENDPOINT_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "r2=${{ secrets.VITE_R2_PUBLIC_URL_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "outlet_role=${{ secrets.VITE_OUTLET_ROLE_ID_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "agency_role=${{ secrets.VITE_AGENCY_ROLE_ID_STAGING }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.api_url }}
            VITE_GRAPHQL_ENDPOINT=${{ steps.vite.outputs.graphql }}
            VITE_R2_PUBLIC_URL=${{ steps.vite.outputs.r2 }}
            VITE_OUTLET_ROLE_ID=${{ steps.vite.outputs.outlet_role }}
            VITE_AGENCY_ROLE_ID=${{ steps.vite.outputs.agency_role }}
          cache-from: type=gha,scope=frontend-${{ needs.prepare.outputs.environment }}
          cache-to: type=gha,mode=max,scope=frontend-${{ needs.prepare.outputs.environment }}

  backend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.backend_tags }}
          cache-from: type=gha,scope=backend-${{ needs.prepare.outputs.environment }}
          cache-to: type=gha,mode=max,scope=backend-${{ needs.prepare.outputs.environment }}

  rollout:
    needs: [prepare, frontend, backend]
    # success() is explicit on purpose. Putting any `if:` on a job REPLACES the
    # implicit success() that `needs:` normally applies, so without it a failed
    # build would still roll out - pointing the server at image tags that were
    # never pushed, and deploy.sh removes the old local images before it pulls.
    if: success() && github.event.inputs.deploy != 'false'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.prepare.outputs.environment }}
      ENV_UPPER: ${{ needs.prepare.outputs.env_upper }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      DOCKERHUB_NAMESPACE: juneyou
      # Selected BY NAME rather than listing both environments, so a staging
      # rollout never has the production key in its environment at all. The
      # index has to be pre-upper-cased - GitHub expressions have no upper().
      SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', needs.prepare.outputs.env_upper)] }}
      SERVER_USER: ${{ secrets[format('{0}_SERVER_USER', needs.prepare.outputs.env_upper)] }}
      SERVER_PORT: ${{ secrets[format('{0}_SERVER_PORT', needs.prepare.outputs.env_upper)] }}
      SERVER_KEY: ${{ secrets[format('{0}_SECRET_KEY', needs.prepare.outputs.env_upper)] }}
      # Optional repo VARIABLE, not a secret - a directory name is not one.
      # Unset means: probe the names this project has actually used.
      REMOTE_DIR: ${{ vars[format('{0}_REMOTE_DIR', needs.prepare.outputs.env_upper)] }}
    steps:
      - name: Roll out over SSH
        shell: bash
        run: |
          set -euo pipefail

          # A secret that does not exist resolves to an EMPTY STRING, not an
          # error - a typo in a secret name would otherwise surface much later
          # as an unreadable ssh usage error. Name the missing ones instead.
          missing=""
          [ -n "$SERVER_IP" ]   || missing="$missing ${ENV_UPPER}_SERVER_IP"
          [ -n "$SERVER_USER" ] || missing="$missing ${ENV_UPPER}_SERVER_USER"
          [ -n "$SERVER_KEY" ]  || missing="$missing ${ENV_UPPER}_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: missing repo secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          PORT="${SERVER_PORT:-22}"

          # tr -d '\r' is load-bearing. A key pasted from Windows carries CRLF
          # line endings and OpenSSH rejects those with "error in libcrypto",
          # then silently falls back to password auth and fails. printf
          # guarantees the trailing newline that echo does not always add.
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > deploy_key

          # "Load key: error in libcrypto" says the key is unreadable but not
          # WHY, and ssh then falls through to password auth and reports a
          # misleading "Permission denied (publickey,password)". Check the
          # shape here. None of this prints the private key.
          key_lines=$(wc -l < deploy_key)
          head -1 deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----' || {
            echo "ERROR: ${ENV_UPPER}_SECRET_KEY does not begin with a PEM header."
            echo "  It is probably the PUBLIC half. Set the private one (~/.ssh/gh_deploy, no .pub)."
            exit 1
          }
          if ! ssh-keygen -y -f deploy_key > deploy_key.pub 2>/dev/null < /dev/null; then
            echo "ERROR: OpenSSH cannot read ${ENV_UPPER}_SECRET_KEY - it is ${key_lines} line(s)."
            if [ "$key_lines" -le 2 ]; then
              echo "  A valid OpenSSH private key is 7+ lines. The line breaks were lost when"
              echo "  the secret was set. Paste the whole file, BEGIN and END lines included."
            else
              echo "  Line count looks right, so the body is corrupt or the key has a passphrase."
              echo "  This job cannot answer a passphrase prompt, so regenerate without one."
            fi
            exit 1
          fi

          HOST="${SERVER_USER}@${SERVER_IP}"
          # BatchMode=yes so a bad key fails immediately instead of hanging on a
          # password prompt that no one can answer.
          OPTS="-o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes -i deploy_key"

          # This job copies NOTHING to the server. The box owns its runtime
          # layout - its compose file, its reverse proxy, its deploy.sh, and
          # above all its .env.backend / .env.frontend, which hold that
          # environment's own database and bucket and differ between servers.
          # All that happens here is: point the image tags at what this run
          # built, then run the server's own deploy.sh.
          ssh $OPTS -p "$PORT" "$HOST" \
            "DEPLOY_ENV='$DEPLOY_ENV' ENV_UPPER='$ENV_UPPER' SHORT_SHA='$SHORT_SHA' NS='$DOCKERHUB_NAMESPACE' WANT_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          # The explicit variable wins; otherwise probe the names this project
          # has used. Printed either way, so the log always names the directory
          # that was actually touched.
          if [ -n "$WANT_DIR" ]; then
            DIR="$HOME/$WANT_DIR"
            [ -d "$DIR" ] || { echo "ERROR: $DIR does not exist, but variable ${ENV_UPPER}_REMOTE_DIR names it."; exit 1; }
          else
            DIR=""
            for candidate in "innocenz-${DEPLOY_ENV}" "innocenz"; do
              if [ -d "$HOME/$candidate" ]; then DIR="$HOME/$candidate"; break; fi
            done
            if [ -z "$DIR" ]; then
              echo "ERROR: found neither ~/innocenz-${DEPLOY_ENV} nor ~/innocenz."
              echo "  If the deployment lives elsewhere, set repository VARIABLE"
              echo "  ${ENV_UPPER}_REMOTE_DIR to its name, under Settings > Secrets and"
              echo "  variables > Actions > Variables."
              exit 1
            fi
          fi
          cd "$DIR"
          echo "Deploying in: $DIR"

          [ -f deploy.sh ] || { echo "ERROR: $DIR/deploy.sh is missing - nothing to run."; exit 1; }
          [ -f .env ] || { echo "ERROR: $DIR/.env is missing - deploy.sh reads the image tags from it."; exit 1; }

          # This server's OWN secrets. CI never writes these - they differ per
          # environment (different database, different R2 bucket), so the only
          # correct copy is the one already on the box. The compose file
          # declares env_file for both, so a missing one aborts compose after
          # the old containers are already down.
          for envfile in .env.backend .env.frontend; do
            [ -f "$envfile" ] || {
              echo "ERROR: $DIR/$envfile is missing - this server's compose declares env_file for it."
              echo "  CI does not create it: it holds this environment's own DB / R2 values."
              exit 1
            }
          done
          echo "Using this server's own .env.backend and .env.frontend (untouched by CI)."

          # Rewrite ONLY the two image tags, so every other key the server keeps
          # in .env survives - including FRONTEND_CONTAINER_NAME and
          # BACKEND_CONTAINER_NAME, which its compose interpolates. Tolerant of
          # a missing line, an indented one, or an `export` prefix, each of
          # which a strictly anchored sed would skip silently.
          # Pinned to the immutable <env>-<sha> tag rather than the floating
          # <env> one, so what starts is exactly what this run built, and a bad
          # deploy rolls back by pointing these two lines at an earlier sha.
          set_env_var() {
            VAR="$1"
            VALUE="$2"
            if grep -qE "^[[:space:]]*(export[[:space:]]+)?${VAR}=" .env; then
              sed -i -E "s|^[[:space:]]*(export[[:space:]]+)?${VAR}=.*|${VAR}=${VALUE}|" .env
            else
              echo "${VAR}=${VALUE}" >> .env
            fi
          }
          FRONTEND_IMAGE="${NS}/innocenz-frontend:${DEPLOY_ENV}-${SHORT_SHA}"
          BACKEND_IMAGE="${NS}/innocenz-backend:${DEPLOY_ENV}-${SHORT_SHA}"
          set_env_var FRONTEND_IMAGE "$FRONTEND_IMAGE"
          set_env_var BACKEND_IMAGE "$BACKEND_IMAGE"
          echo "Frontend: $FRONTEND_IMAGE"
          echo "Backend:  $BACKEND_IMAGE"

          chmod +x deploy.sh
          ./deploy.sh

          # Proof, read back out of the RUNNING container rather than off disk:
          # which database and bucket this environment actually came up on. The
          # file says what the backend was given; this says what it took. It is
          # the check that a staging rollout did not start on production data.
          # No password is printed - the connection string is not read.
          BACKEND_NAME="$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?BACKEND_CONTAINER_NAME=(.*)$/\2/p' .env | tail -1)"
          BACKEND_NAME="${BACKEND_NAME:-innocenz-backend}"
          echo "=== Backend runtime check (${BACKEND_NAME}) ==="
          docker exec "$BACKEND_NAME" printenv POSTGRES_HOST POSTGRES_DB R2_BUCKET_NAME R2_PUBLIC_URL 2>/dev/null \
            || echo "(could not read the backend container's environment - is it up?)"
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f deploy_key deploy_key.pub
