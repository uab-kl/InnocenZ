name: Deploy

# Builds + pushes Docker images to Docker Hub, then SSHes to the VPS and rolls
# them out by running tools/deploy/deploy.sh there — the same script a
# `pnpm deploy:<env>` from a PC runs. Deploying from GitHub alone is enough to
# put the new build online; no local Docker build or push is needed.
#
# The server is provisioned ONCE from a PC (`pnpm deploy:staging`), which is what
# creates ~/innocenz-<env>/ with its Caddyfile + .env.backend. Those two stay
# server-managed and never travel through CI: .env.backend holds the DB/R2
# secrets, and Caddyfile encodes that server's own domain.
#
# Triggers:
#   - Manual: Actions → Deploy → Run workflow → pick environment
#   - Tags:   staging-* / beta-* → staging
#             v*                 → production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (image tag + VITE_* secrets)
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      deploy:
        description: Roll out to the server after building
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
      - 'staging-*'
      - 'beta-*'

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: juneyou
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      frontend_tags: ${{ steps.meta.outputs.frontend_tags }}
      backend_tags: ${{ steps.meta.outputs.backend_tags }}
      env_upper: ${{ steps.meta.outputs.env_upper }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine environment + image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # Manual run wins; otherwise infer from tag.
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "${ENV}" ]; then
            REF="${GITHUB_REF_NAME}"
            case "${REF}" in
              v*) ENV=production ;;
              staging-*|beta-*) ENV=staging ;;
              *)
                echo "Cannot infer environment from ref: ${REF}"
                exit 1
                ;;
            esac
          fi

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "env_upper=$(echo "${ENV}" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${DOCKERHUB_NAMESPACE}/innocenz-frontend:${ENV}-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-frontend:${ENV}" >> "$GITHUB_OUTPUT"
          echo "backend_tags=${DOCKERHUB_NAMESPACE}/innocenz-backend:${ENV}-${SHORT_SHA},${DOCKERHUB_NAMESPACE}/innocenz-backend:${ENV}" >> "$GITHUB_OUTPUT"
          echo "Building for environment=${ENV}"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve VITE_* for environment
        id: vite
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ needs.prepare.outputs.environment }}"
          if [ "${ENV}" = "production" ]; then
            echo "api_url=${{ secrets.VITE_API_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "graphql=${{ secrets.VITE_GRAPHQL_ENDPOINT_PROD }}" >> "$GITHUB_OUTPUT"
            echo "r2=${{ secrets.VITE_R2_PUBLIC_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "outlet_role=${{ secrets.VITE_OUTLET_ROLE_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "agency_role=${{ secrets.VITE_AGENCY_ROLE_ID_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ secrets.VITE_API_URL_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "graphql=${{ secrets.VITE_GRAPHQL_ENDPOINT_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "r2=${{ secrets.VITE_R2_PUBLIC_URL_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "outlet_role=${{ secrets.VITE_OUTLET_ROLE_ID_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "agency_role=${{ secrets.VITE_AGENCY_ROLE_ID_STAGING }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.api_url }}
            VITE_GRAPHQL_ENDPOINT=${{ steps.vite.outputs.graphql }}
            VITE_R2_PUBLIC_URL=${{ steps.vite.outputs.r2 }}
            VITE_OUTLET_ROLE_ID=${{ steps.vite.outputs.outlet_role }}
            VITE_AGENCY_ROLE_ID=${{ steps.vite.outputs.agency_role }}
          cache-from: type=gha,scope=frontend-${{ needs.prepare.outputs.environment }}
          cache-to: type=gha,mode=max,scope=frontend-${{ needs.prepare.outputs.environment }}

  backend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.backend_tags }}
          cache-from: type=gha,scope=backend-${{ needs.prepare.outputs.environment }}
          cache-to: type=gha,mode=max,scope=backend-${{ needs.prepare.outputs.environment }}

  rollout:
    needs: [prepare, frontend, backend]
    # success() is explicit on purpose. Putting any `if:` on a job REPLACES the
    # implicit success() that `needs:` normally applies, so without it a failed
    # build would still roll out — pointing the server at image tags that were
    # never pushed, and deploy.sh deletes the old local images before it pulls.
    if: success() && github.event.inputs.deploy != 'false'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.prepare.outputs.environment }}
      ENV_UPPER: ${{ needs.prepare.outputs.env_upper }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      DOCKERHUB_NAMESPACE: juneyou
      # Selected BY NAME rather than listing both environments, so a staging
      # rollout never has the production key in its environment at all. The
      # index has to be pre-upper-cased — GitHub expressions have no upper().
      SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', needs.prepare.outputs.env_upper)] }}
      SERVER_USER: ${{ secrets[format('{0}_SERVER_USER', needs.prepare.outputs.env_upper)] }}
      SERVER_PORT: ${{ secrets[format('{0}_SERVER_PORT', needs.prepare.outputs.env_upper)] }}
      SERVER_KEY: ${{ secrets[format('{0}_SECRET_KEY', needs.prepare.outputs.env_upper)] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Roll out over SSH
        shell: bash
        run: |
          set -euo pipefail

          # A secret that does not exist resolves to an EMPTY STRING, not an
          # error — a typo in a secret name would otherwise surface much later
          # as an unreadable ssh usage error. Name the missing ones instead.
          missing=""
          [ -n "$SERVER_IP" ]   || missing="$missing ${ENV_UPPER}_SERVER_IP"
          [ -n "$SERVER_USER" ] || missing="$missing ${ENV_UPPER}_SERVER_USER"
          [ -n "$SERVER_KEY" ]  || missing="$missing ${ENV_UPPER}_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: missing repo secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          PORT="${SERVER_PORT:-22}"

          # tr -d '\r' is load-bearing. A key pasted from Windows carries CRLF
          # line endings and OpenSSH rejects those with "error in libcrypto",
          # then silently falls back to password auth and fails. printf
          # guarantees the trailing newline that echo does not always add.
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > deploy_key

          # "Load key: error in libcrypto" tells you the key is unreadable but
          # not WHY, and ssh then falls through to password auth and reports a
          # misleading "Permission denied (publickey,password)". Check the shape
          # here instead. None of this prints the private key.
          key_lines=$(wc -l < deploy_key)
          head -1 deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----' || {
            echo "ERROR: ${ENV_UPPER}_SECRET_KEY does not begin with a PEM header."
            echo "  It is probably the PUBLIC half. Set the private one (~/.ssh/gh_deploy, no .pub)."
            exit 1
          }
          if ! ssh-keygen -y -f deploy_key > deploy_key.pub 2>/dev/null < /dev/null; then
            echo "ERROR: OpenSSH cannot read ${ENV_UPPER}_SECRET_KEY - it is ${key_lines} line(s)."
            if [ "$key_lines" -le 2 ]; then
              echo "  A valid OpenSSH private key is 7+ lines. The line breaks were lost when"
              echo "  the secret was set - passing it as one argument does that. Re-set it FROM"
              echo "  THE FILE, which preserves them:"
              echo "    gh secret set ${ENV_UPPER}_SECRET_KEY -R ${GITHUB_REPOSITORY} < ~/.ssh/gh_deploy"
            else
              echo "  Line count looks right, so the body is corrupt or the key has a passphrase."
              echo "  This job cannot answer a passphrase prompt. Regenerate without one:"
              echo "    ssh-keygen -t ed25519 -f ~/.ssh/gh_deploy -N '' -C github-actions"
            fi
            exit 1
          fi
          echo "Deploy key parses (${key_lines} lines). Its PUBLIC half is below - this exact"
          echo "line must be present in ~/.ssh/authorized_keys on the target server:"
          cat deploy_key.pub

          HOST="${SERVER_USER}@${SERVER_IP}"
          # BatchMode=yes so a bad key fails immediately instead of hanging on a
          # password prompt that no one can answer.
          OPTS="-o StrictHostKeyChecking=no -o BatchMode=yes -o IdentitiesOnly=yes -i deploy_key"
          DIR="innocenz-${DEPLOY_ENV}"

          echo "Rolling out ${DEPLOY_ENV} @ ${SHORT_SHA} to ~/${DIR}"

          # Refuse before touching anything. scp into a missing directory fails
          # cryptically, and a missing .env.backend / Caddyfile would bring the
          # stack up with no DATABASE_URL or no HTTPS routing at all.
          ssh $OPTS -p "$PORT" "$HOST" "
            set -e
            [ -d \"\$HOME/$DIR\" ] || { echo 'ERROR: ~/$DIR does not exist. Provision it once from a PC: pnpm deploy:'\"$DEPLOY_ENV\"; exit 1; }
            [ -f \"\$HOME/$DIR/.env.backend\" ] || { echo 'ERROR: ~/$DIR/.env.backend missing — backend would boot with no DATABASE_URL / R2.'; exit 1; }
            [ -f \"\$HOME/$DIR/Caddyfile\" ] || { echo 'ERROR: ~/$DIR/Caddyfile missing — Caddy would mount a directory and serve nothing.'; exit 1; }
            [ -f \"\$HOME/$DIR/.env.frontend\" ] || { echo 'ERROR: ~/$DIR/.env.frontend missing - compose declares env_file for it and aborts before pulling. VITE_* are baked in at build time, so an empty file is correct: touch ~/$DIR/.env.frontend'; exit 1; }
          "

          # Keep the two non-secret server files in step with the repo, so a
          # change under tools/deploy/ ships without needing a PC deploy.
          scp $OPTS -P "$PORT" \
            tools/deploy/docker-compose.yml tools/deploy/deploy.sh \
            "$HOST:$DIR/"

          # Quoted heredoc: the values below are handed over as remote variables
          # rather than expanded into the script, so nothing in the remote body
          # gets mangled by the runner.
          ssh $OPTS -p "$PORT" "$HOST" \
            "DEPLOY_ENV='$DEPLOY_ENV' SHORT_SHA='$SHORT_SHA' NS='$DOCKERHUB_NAMESPACE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/innocenz-${DEPLOY_ENV}"

          grep -q '^DATABASE_URL=.' .env.backend || {
            echo "ERROR: .env.backend has no DATABASE_URL — refusing to start."
            exit 1
          }

          # The same five keys tools/scripts/deploy.mjs generates, so a CI rollout
          # and a PC deploy leave the server in an identical state. Pinned to the
          # immutable <env>-<sha> tag rather than the floating <env> one, so what
          # starts here is exactly what this run built — and a bad deploy rolls
          # back by pointing these two lines at an earlier sha.
          cat > .env <<ENV
          DEPLOY_ENV=${DEPLOY_ENV}
          FRONTEND_IMAGE=${NS}/innocenz-frontend:${DEPLOY_ENV}-${SHORT_SHA}
          BACKEND_IMAGE=${NS}/innocenz-backend:${DEPLOY_ENV}-${SHORT_SHA}
          FRONTEND_CONTAINER_NAME=innocenz-frontend
          BACKEND_CONTAINER_NAME=innocenz-backend
          ENV

          NETWORK="innocenz-${DEPLOY_ENV}-network"
          docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"

          chmod +x deploy.sh
          ./deploy.sh
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f deploy_key deploy_key.pub
