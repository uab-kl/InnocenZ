packages:
  - 'packages/*'
  - 'apps/*'

onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@parcel/watcher'
  - '@swc/core'
  - bcrypt
  - esbuild
  - less
  - nx
  - sharp
  - unrs-resolver

overrides:
  # Keep ONE copy at the root. webpack-dev-server drags in the Express-4
  # types (4.19.9); when those win the root slot, apps/backend can no longer
  # name express Router and every *.routes.ts fails with TS2742.
  '@types/express-serve-static-core': '^5.1.2'
  react: 19.2.7
  react-dom: 19.2.7
  expo: 55.0.27
  react-native: 0.83.6

patchedDependencies:
  metro-file-map@0.83.7: patches/metro-file-map@0.83.7.patch
  react-native@0.83.6: patches/react-native@0.83.6.patch
